# Opt-in: grants the SERVER host-level Docker management authority.
# docker compose -f docker-compose.yml -f docker-compose.execution.yml up -d --build
# Project persistence is provided by the base Compose file.
# For older installations, see the migration steps in docs/execution-environments-docker.md.
services:
  server:
    build:
      target: server-docker
    environment:
      - AUTOMAKER_DOCKER_SOCKET_ACCESS=true
      - AUTOMAKER_DOCKER_CONTROLLER=automaker-server
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - type: bind
        source: ${AUTOMAKER_DOCKER_SOCKET:-/var/run/docker.sock}
        target: /var/run/docker.sock
        read_only: true
        bind:
          create_host_path: false
